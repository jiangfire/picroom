name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write   # create GitHub Release and attach binary assets
  packages: write   # push container images to GHCR

jobs:
  # ---------------------------------------------------------------------
  # Build and push Docker images for amd64 + arm64
  # ---------------------------------------------------------------------
  docker:
    name: docker (linux-${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            qemu_arch: amd64
          - arch: arm64
            qemu_arch: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu_arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Picroom
            org.opencontainers.image.description=Self-hosted image hosting service
            org.opencontainers.image.licenses=MIT

      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # Build release binaries for Linux (x86_64/aarch64), Windows (x86_64),
  # and macOS (x86_64/aarch64). The release profile already strips symbols
  # (Cargo.toml [profile.release] strip = "symbols"), so no manual strip.
  # ---------------------------------------------------------------------
  binary:
    name: binary (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_ext: tar.gz
            use_cross: false
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_ext: tar.gz
            use_cross: true
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_ext: zip
            use_cross: false
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_ext: tar.gz
            use_cross: false
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            asset_ext: tar.gz
            use_cross: false
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin picroom

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }} --bin picroom

      - name: Package (tar.gz)
        if: matrix.asset_ext == 'tar.gz'
        shell: bash
        run: |
          DIR="picroom-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/picroom" "$DIR/picroom"
          cp docker/config.example.toml "$DIR/config.example.toml"
          cp README.md LICENSE "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"

      - name: Package (zip)
        if: matrix.asset_ext == 'zip'
        shell: pwsh
        run: |
          $dir = "picroom-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/picroom.exe" "$dir/picroom.exe"
          Copy-Item docker/config.example.toml "$dir/config.example.toml"
          Copy-Item README.md, LICENSE "$dir/"
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: picroom-${{ matrix.name }}
          path: picroom-${{ steps.version.outputs.version }}-${{ matrix.name }}.${{ matrix.asset_ext }}

      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: picroom-${{ steps.version.outputs.version }}-${{ matrix.name }}.${{ matrix.asset_ext }}
          generate_release_notes: true
          draft: false

  # ---------------------------------------------------------------------
  # Build the Tauri Windows admin client installer (NSIS + MSI) and attach
  # it to the GitHub Release. Runs on the GitHub-hosted Windows runner, so
  # no local Windows SDK / build machine is required (Task 3.4 of the
  # admin-client plan).
  #
  # Authenticode code signing is enabled automatically when the repo secrets
  # WINDOWS_CERTIFICATE (base64 of a .p12/.pfx) + WINDOWS_CERTIFICATE_PASSWORD
  # are set. Until then the job builds UNSIGNED installers (SmartScreen warns).
  #
  # NOTE: MSI bundling needs the WiX toolset. windows-latest ships WiX, but if
  # the MSI step ever fails with "light.exe not found", either add a
  # `choco install wixtoolset` step before this one, or drop to `--bundles nsis`.
  # ---------------------------------------------------------------------
  desktop:
    name: desktop (windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: windows-msvc

      # tauri-action shells out to `npm run tauri` — the CLI lives in
      # devDependencies, so node_modules must exist first.
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Build + sign + bundle (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: desktop
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          generate_release_notes: true
          draft: false
