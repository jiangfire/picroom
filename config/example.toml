# Picroom example configuration.
#
# Copy to `config.toml` (or `/etc/picroom/config.toml`) and adjust.
# Environment variables prefixed with `PICROOM_` override TOML values; nested
# keys use a double underscore, e.g. `PICROOM_AUTH__JWT_SECRET`.
# TOML wins over compiled-in defaults.

[server]
bind_addr = "0.0.0.0:8080"
request_timeout_secs = 30
graceful_shutdown_secs = 30
max_body_mb = 100
# public_url_base = "https://cdn.example.com"   # absolute links for /link & /file

[database]
url = "postgres://picroom:secret@localhost:5432/picroom"
max_connections = 20
min_connections = 2

[storage]
default = "primary"

[storage.policies.primary]
driver = "s3"
bucket = "picroom-prod"
endpoint = "https://s3.amazonaws.com"
region = "us-east-1"
access_key_id = "${AWS_ACCESS_KEY_ID}"
secret_access_key = "${AWS_SECRET_ACCESS_KEY}"

[pipeline]
encode_avif = true
encode_webp = true
generate_thumbnail = true
strip_exif = true
max_dimension = 8192

[auth]
allow_signup = false
password_min_length = 12
jwt_secret = "change-me"                 # MUST be overridden in production
jwt_issuer = "picroom"
jwt_audience = "picroom-api"
jwt_ttl_secs = 3600

# OIDC / SSO — optional. Leave `providers` empty to disable.
[auth.oidc]
admin_emails = ["admin@example.com"]     # emails promoted to `admin` on first OIDC login
secure_cookies = true                    # set false only for local HTTP dev (no TLS)

[auth.oidc.providers.google]
issuer = "https://accounts.google.com"
client_id = "${OIDC_GOOGLE_CLIENT_ID}"
client_secret = "${OIDC_GOOGLE_CLIENT_SECRET}"
redirect_uri = "https://picroom.example.com/api/v1/auth/oidc/google/callback"
scopes = ["openid", "email", "profile"]

[quota]
default_user_bytes = 10737418240         # 10 GiB
default_team_bytes = 1099511627776       # 1 TiB
soft_limit_warning = 0.9
hard_limit_enforce = true

[rate_limit]
per_user_rps = 10
per_user_burst = 20
per_ip_rps = 50
per_ip_burst = 100

[audit]
retention_days = 365

[logging]
level = "info"
format = "json"                          # "json" or "pretty"

[telemetry]
metrics_enabled = true
# otlp_endpoint = "http://localhost:4317"
